<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Queue | Admin - Staff Management</title>

    <link rel="stylesheet" href="/Admin_WebPages/admin.css">
    <link rel="stylesheet" href="/Admin_WebPages/StaffManagement.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script type="module" src="../pwa.js"></script>
</head>

<body>
<header class="top-bar">
    <section class="logo">
        <section class="logo-icon"></section>
        <section class="logo-name">Care Queue</section>
    </section>
</header>    
<section class="admin-container">

    <!-- Sidebar -->
    <aside class="sidebar">
            <nav class="sidebar-nav">
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/dashboard.html'">
                    <section class="nav-dot"></section>
                    <section>Dashboard</section>
                </section>
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/clinicManagement.html'">
                    <section class="nav-dot"></section>
                    <section>Clinic Management</section>
                </section>
                <section class="nav-item active" onclick="window.location.href='/Admin_WebPages/StaffManagement.html'">
                    <section class="nav-dot"></section>
                    <section>Staff Management</section>
                </section>
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/analytics.html'">
                    <section class="nav-dot"></section>
                    <section>Analytics</section>
                </section>
        </nav>
        <section class="sidebar-footer">
            <section class="user-info">

                <section
                    class="user-avatar"
                    id="adminAvatar"
                ></section>

                <section class="user-details">
                    <section
                        class="user-name"
                        id="adminName"
                    ></section>

                    <section
                        class="user-email"
                        id="adminEmail"
                    ></section>
                </section>

            </section>
        </section>
    </aside>

    <!-- Main -->
    <main class="main-content">

        <section class="page-header">
            <h1 class="page-title">Staff Management</h1>
            <p class="page-subtitle">Add or remove clinic staff members</p>
        </section>

        <!-- STAFF CARD -->
        <section class="staff-card">

            <section class="card-header">
                <p class="card-title">
                    All Staff Members (<span id="staffCount">0</span>)
                </p>

                <button class="btn btn-primary" onclick="openInviteModal()">
                    + Invite Staff
                </button>
            </section>

            <table class="data-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Clinic</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="staffTableBody">
                <tr>
                    <td colspan="4" style="text-align:center; padding:40px;">
                        Loading...
                    </td>
                </tr>
                </tbody>
            </table>

        </section>
    </main>
</section>

<!-- MODAL -->
<section id="inviteModal" class="modal-overlay" style="display:none;">
    <section class="modal-content">

        <h3 class="modal-header">Invite Staff Member</h3>

        <section class="modal-body">

            <section class="form-group">
                <label>Full Name</label>
                <input id="staffName" class="form-input" type="text">
            </section>

            <section class="form-group">
                <label>Email</label>
                <input id="staffEmail" class="form-input" type="email">
            </section>

            <section class="form-group">
                <label>Assign Clinic</label>

                <input
                        list="clinicList"
                        id="staffClinicInput"
                        class="form-input"
                        placeholder="Search clinic..."
                        autocomplete="off"
                >

                <datalist id="clinicList"></datalist>

                <input type="hidden" id="staffClinicId">
            </section>

        </section>

        <section class="modal-footer">
            <button class="btn" onclick="closeInviteModal()">Cancel</button>
            <button class="btn btn-primary" onclick="addStaff()">Add Staff</button>
        </section>

    </section>
</section>

<!-- TOAST -->
<p id="toast" class="toast"></p>

<script type="module" src="/Admin_WebPages/StaffManagement.js"></script>

</body>
</html>

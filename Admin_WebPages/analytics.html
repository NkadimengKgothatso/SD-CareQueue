<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Queue | Admin -Analytics</title>
    <!-- Base admin portal styles first -->
    <link rel="stylesheet" href="/Admin_WebPages/admin.css">
    <!-- Clinic-specific styles layered on top (cards, search bar, clinic chips) -->
    <link rel="stylesheet" href="/Admin_WebPages/analytics.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  
</head>
<body>
    <section class="admin-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <section class="sidebar-header">
                <section class="logo">
                    <section class="logo-icon"></section>
                    <section class="logo-name">Care Queue</section>
                </section>
            </section>
            <nav class="sidebar-nav">
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/dashboard.html'">
                    <section class="nav-dot"></section>
                    <section>Dashboard</section>
                </section>
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/clinicManagement.html'">
                    <section class="nav-dot"></section>
                    <section>Clinic Management</section>
                </section>
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/StaffManagement.html'">
                    <section class="nav-dot"></section>
                    <section>Staff Management</section>
                </section>
                 <!-- active page highlight -->
                <section class="nav-item active" onclick="window.location.href='/Admin_WebPages/analytics.html'">
                    <section class="nav-dot"></section>
                    <section>Analytics</section>
                </section>
            </nav>
            <section class="sidebar-footer">
                <section class="user-info">
                    <section class="user-avatar" id="adminAvatar"></section>
                    <section class="user-details">
                        <section class="user-name" id="adminName"></section>
                        <section class="user-email" id="adminEmail"></section>
                    </section>
                </section>
            </section>
        </aside>



        <main class="analytics-main">

    <!-- Page Header -->
    <header class="page-header">
        <section>
            <h1 class="page-title">Analytics</h1>
            <p class="page-subtitle">View clinic performance insights</p>
        </section>
    </header>

    <!-- Filters -->
    <section class="card filters-card">
        <header class="card-header">
            <h2>Reports</h2>
        </header>

        <form class="filters-form" id="filterForm">
            <section class="filter-group">
                <label for="dateFrom">From</label>
                <input type="date" id="dateFrom">
            </section>

            <section class="filter-group">
                <label for="dateTo">To</label>
                <input type="date" id="dateTo">
            </section>

             

            <button type="submit" class="btn-primary">Apply</button>
            <!-- <button type="button" id="exportCSV" class="btn-secondary">Export CSV</button>
            <button type="button" id="exportPDF" class="btn-primary">Export PDF</button> -->
        </form>
    </section>

    <!-- KPI Section -->
<section class="kpi-section">
    <header class="section-header">
        <h2>Overview Across All Clinics</h2>
    
    </header>

    <section class="kpi-grid">
        <article class="kpi-card">
            <section>Patients seen</section>
            <h3 id="patientsValue">—</h3>
        </article>

        <article class="kpi-card">
            <section>Avg wait time</section>
            <h3 id="waitValue">—</h3>
        </article>

        <article class="kpi-card">
            <section>No-Show Rate</section>
            <h3 id="noShowValue">—</h3>
        </article>

        <article class="kpi-card">
            <section>vs last month</section>
            <h3 id="trendValue">—</h3>
        </article>
    </section>
</section><br></br>

 

    <!-- Table Report -->
    <section class="card">
        <header class="card-header">
    <h2>Clinic Performance Analytics</h2>
</header>

<!-- Search Bar -->
<section class="filter-group">
    <label for="clinicSearch">Search Clinic</label>
    <input 
        type="text" 
        id="clinicSearch" 
        placeholder="Type clinic name..."
    />
</section>

<section class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>Clinic</th>
                <th>Avg Wait</th>
                <th>Volume</th>
                <th>No-Show Rates</th>
            </tr>
        </thead>
        <tbody id="waitTableBody">
            <!-- JS will populate -->
        </tbody>
    </table>
</section>
    </section>

 

</main>

 <script type="module" src="analytics.js"></script>        
</html>

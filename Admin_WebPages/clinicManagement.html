<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Queue | Admin - Clinic Management</title>
    <!-- Base admin portal styles first -->
    <link rel="stylesheet" href="/Admin_WebPages/admin.css">
    <!-- Clinic-specific styles layered on top (cards, search bar, clinic chips) -->
    <link rel="stylesheet" href="/Admin_WebPages/clinicManagement.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <section class="admin-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <section class="sidebar-header">
                <section class="logo">
                    <section class="logo-icon"></section>
                    <section class="logo-name">Care Queue</section>
                </section>
            </section>
            <nav class="sidebar-nav">
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/Dashboard.html'">
                    <section class="nav-dot"></section>
                    <section>Dashboard</section>
                </section>
                <section class="nav-item active" onclick="window.location.href='/Admin_WebPages/ClinicManagement.html'">
                    <section class="nav-dot"></section>
                    <section>Clinic Management</section>
                </section>
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/StaffManagement.html'">
                    <section class="nav-dot"></section>
                    <section>Staff Management</section>
                </section>
                <section class="nav-item" onclick="window.location.href='/Admin_WebPages/analytics.html'">
                    <section class="nav-dot"></section>
                    <section>Analytics</section>
                </section>
            </nav>
            <section class="sidebar-footer">
                <section class="user-info">
                    <section class="user-avatar" id="adminAvatar"></section>
                    <section class="user-details">
                        <section class="user-name" id="adminName"></section>
                        <section class="user-email" id="adminEmail"></section>
                    </section>
                </section>
            </section>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <section class="page-header">
                <h1 class="page-title">Clinic Management</h1>
                <p class="page-subtitle">Add, edit, or remove clinics from the system</p>
            </section>

        <section class="content">
            <section class="search-Bar">
                <i class="fa-solid fa-magnifying-glass-location" style="color: var(--color-brand);"></i>
                <input id="clinicSearch" type="search" placeholder="Search clinic by name or location">
            </section>

            <!-- Clinics card -->
            <section class="clinicsCard">
                <section class="clinicCardHeader">
                    <p class="section-label" style="margin-right: auto; flex: 1;">CLINICS</p>
                    <button class="addBtn">+ Add Clinic</button>
                </section>
                <section class="clinics"></section>
            </section>
        </main>
    </section>

    <!-- Add Clinic Modal -->
    <section class="modal" id="clinicModal">
        <section class="modal-content">
            <section class="close-btn">&times;</section>
            <h3>Add Clinic</h3>
            <form class="clinicForm">
                <input type="text" placeholder="Clinic Name" class="form-control" id="clinicName" required>
                <input type="text" placeholder="Location" class="form-control" id="Location" required>

                <section class="custom-select" id="clinicServicesDropdown">
                    <section class="select-trigger">Select Services <i class="fa-solid fa-chevron-down"></i></section>
                    <section class="select-options">
                        <label><input type="checkbox" value="General"> General</label>
                        <label><input type="checkbox" value="Emergency"> Emergency</label>
                        <label><input type="checkbox" value="Maternity"> Maternity</label>
                        <label><input type="checkbox" value="Paediatrics"> Paediatrics</label>
                        <label><input type="checkbox" value="Dentistry"> Dentistry</label>
                        <label><input type="checkbox" value="Ophthalmology"> Ophthalmology</label>
                        <label><input type="checkbox" value="Pharmacy"> Pharmacy</label>
                        <label><input type="checkbox" value="Radiology"> Radiology</label>
                        <label><input type="checkbox" value="Physiotherapy"> Physiotherapy</label>
                        <label><input type="checkbox" value="Mental Health"> Mental Health</label>
                        <label><input type="checkbox" value="HIV/AIDS"> HIV/AIDS</label>
                        <label><input type="checkbox" value="TB Treatment"> TB Treatment</label>
                        <label><input type="checkbox" value="Chronic Disease"> Chronic Disease</label>
                        <label><input type="checkbox" value="Occupational Health"> Occupational Health</label>
                        <label><input type="checkbox" value="Laboratory"> Laboratory</label>
                    </section>
                </section>

                <select id="province">
                    <option value="" disabled selected>Select Province</option>
                    <option>Gauteng</option>
                    <option>Western Cape</option>
                    <option>Eastern Cape</option>
                    <option>KwaZulu-Natal</option>
                    <option>Free State</option>
                    <option>Limpopo</option>
                    <option>Mpumalanga</option>
                    <option>North West</option>
                    <option>Northern Cape</option>
                </select>
                

                <select id="clinicStatus" required>
                    <option value="Active">Active</option>
                    <option value="Closed">Closed</option>
                    <option value="Busy">Busy</option>
                </select>
                <button type="submit">Add Clinic</button>
            </form>

        </section>
    </section>


    <section class="ManageModal" id="ManageClinicModal">
        <section class="modal-content">

            <section class="close-btn">&times;</section>

            <h3>Manage clinic</h3>

            <form class="clinicForm">
                <input type="text" placeholder="Clinic Name" class="form-control" id="ManageClinicName" required>
                <input type="text" placeholder="Location" class="form-control" id="ManageLocation" required>
                <section class="custom-select" id="manageClinicServicesDropdown">
                    <section class="select-trigger">Select Services <i class="fa-solid fa-chevron-down"></i></section>
                    <section class="select-options">
                        <label><input type="checkbox" value="General"> General</label>
                        <label><input type="checkbox" value="Emergency"> Emergency</label>
                        <label><input type="checkbox" value="Maternity"> Maternity</label>
                        <label><input type="checkbox" value="Paediatrics"> Paediatrics</label>
                        <label><input type="checkbox" value="Dentistry"> Dentistry</label>
                        <label><input type="checkbox" value="Ophthalmology"> Ophthalmology</label>
                        <label><input type="checkbox" value="Pharmacy"> Pharmacy</label>
                        <label><input type="checkbox" value="Radiology"> Radiology</label>
                        <label><input type="checkbox" value="Physiotherapy"> Physiotherapy</label>
                        <label><input type="checkbox" value="Mental Health"> Mental Health</label>
                        <label><input type="checkbox" value="HIV/AIDS"> HIV/AIDS</label>
                        <label><input type="checkbox" value="TB Treatment"> TB Treatment</label>
                        <label><input type="checkbox" value="Chronic Disease"> Chronic Disease</label>
                        <label><input type="checkbox" value="Occupational Health"> Occupational Health</label>
                        <label><input type="checkbox" value="Laboratory"> Laboratory</label>
                    </section>
                </section>

                <select id="manageProvince">
                    <option value="" disabled selected>Select Province</option>
                    <option>Gauteng</option>
                    <option>Western Cape</option>
                    <option>Eastern Cape</option>
                    <option>KwaZulu-Natal</option>
                    <option>Free State</option>
                    <option>Limpopo</option>
                    <option>Mpumalanga</option>
                    <option>North West</option>
                    <option>Northern Cape</option>
                </select>

                <select id="ManageClinicStatus" required>
                    <option value="Active">Active</option>
                    <option value="Closed">Closed</option>
                    <option value="Busy">Busy</option>
                </select>

                <button type="submit">Update Clinic</button>
            </form>

        </section>
    </section>

    <section class="modal" id="clinicHoursModal">
        <section class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Set Operating Hours</h3>    
            <form class="clinicForm">
                <select id="startDay">
                    <option value="" disabled selected>Start Day</option>
                    <option value="Mon">Monday</option>
                    <option value="Tue">Tuesday</option>
                    <option value="Wed">Wednesday</option>
                    <option value="Thu">Thursday</option>
                    <option value="Fri">Friday</option>
                    <option value="Sat">Saturday</option>
                    <option value="Sun">Sunday</option>
                </select>

                <select id="endDay">
                    <option value="" disabled selected>End Day</option>
                    <option value="Mon">Monday</option>
                    <option value="Tue">Tuesday</option>
                    <option value="Wed">Wednesday</option>
                    <option value="Thu">Thursday</option>
                    <option value="Fri">Friday</option>
                    <option value="Sat">Saturday</option>
                    <option value="Sun">Sunday</option>
                </select>  

                <select id="startTime">
                    <option value="" disabled selected>Start Time</option>
                    <option value="6am">6:00 AM</option>
                    <option value="7am">7:00 AM</option>
                    <option value="8am">8:00 AM</option>
                    <option value="9am">9:00 AM</option>
                    <option value="10am">10:00 AM</option>
                    <option value="11am">11:00 AM</option>
                    <option value="12pm">12:00 PM</option>
                    <option value="1pm">1:00 PM</option>
                    <option value="2pm">2:00 PM</option>
                    <option value="3pm">3:00 PM</option>
                    <option value="4pm">4:00 PM</option>
                    <option value="5pm">5:00 PM</option>
                    <option value="6pm">6:00 PM</option>
                    <option value="7pm">7:00 PM</option>
                    <option value="8pm">8:00 PM</option>
                </select>

                <select id="endTime">
                    <option value="" disabled selected>Start Time</option>
                    <option value="6am">6:00 AM</option>
                    <option value="7am">7:00 AM</option>
                    <option value="8am">8:00 AM</option>
                    <option value="9am">9:00 AM</option>
                    <option value="10am">10:00 AM</option>
                    <option value="11am">11:00 AM</option>
                    <option value="12pm">12:00 PM</option>
                    <option value="1pm">1:00 PM</option>
                    <option value="2pm">2:00 PM</option>
                    <option value="3pm">3:00 PM</option>
                    <option value="4pm">4:00 PM</option>
                    <option value="5pm">5:00 PM</option>
                    <option value="6pm">6:00 PM</option>
                    <option value="7pm">7:00 PM</option>
                    <option value="8pm">8:00 PM</option>
                </select>

                <button type="submit">Update Operating Hours</button>
            </form>    
        </section>


    <script src="clinicManagementLogic.js"></script>
    <script type="module" src="clinicManagement.js"></script>
</body>
</html>

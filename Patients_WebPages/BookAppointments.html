<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="a-sidebar.css">
    <link rel="stylesheet" href="patientDashboard.css">
    <link rel="stylesheet" href="bookAppointments.css">
    
    
    
</head>
<body>

<header class="top-bar">
    <nav class="logo">
        <section class="logo-icon"></section>
        <section class="logo-name">Care Queue</section>
    </nav>
</header>

<main class="container">

     <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav class="sidebar-nav">

            <section class="nav-item" onclick="window.location.href='PatientDashboard.html'">
                <section class="nav-dot"></section>
                <section>Dashboard</section>
            </section>

            <section class="nav-item active" onclick="window.location.href='BookAppointments.html'">
                <section class="nav-dot"></section>
                <section>Book Appointment</section>
            </section>

            <section class="nav-item" onclick="window.location.href='MyAppointments.html'">
                <section class="nav-dot"></section>
                <section>My Appointments</section>
            </section>

            <section class="nav-item" onclick="window.location.href='patientNotifications.html'">
                <section class="nav-dot"></section>
                <section>Notifications</section>
                <section id="sidebarUnreadCount" class="sidebar-badge">0</section>
            </section>

        </nav>

        <!-- USER PANEL -->
        <section class="sidebar-footer">
            <section class="user-info">
                <section class="user-avatar" id="patientAvatar">PT</section>
                <section class="user-details">
                    <section class="user-name" id="userName">Patient Name</section>
                    <!-- userRole: referenced by JS, hidden visually but must exist in DOM -->
                    <section class="user-email" id="userEmail">patient@email.com</section>
                    <section id="userRole" style="display:none;"></section>
                </section>
            </section>
        </section>
    </aside>
        <main class="main-content">
            <h2 id="pageTitle">Book Appointment</h2>
            <p class="FindClinic-Text">Find a clinic & select a slot</p>

            <!-- Search Clinic Card -->
            <section class="search-Clinic">

                <section class="search-Row">
                    <section class="search-Bar">
                        <i class="fa-solid fa-magnifying-glass-location" style="color: var(--color-brand);"></i>
                        <input id="clinicSearch" type="search" placeholder="Search clinic by name">
                    </section>
                </section>

            <section class="quick-Actions">
                <button class="quick-btn" id="nearMeBtn">
                    <i class="fa-solid fa-location-crosshairs"></i>
                    Near Me
                </button>

                <button class="quick-btn" id="openNowBtn">
                    <i class="fa-solid fa-clock"></i>
                    Open Now
                </button>
            </section>

            <section style="display: flex; gap: 20px;">
                <section class="clinic" style="width: 50%;">
                    <p class="section-label">Available Clinics</p>
                    <section id="clinicResults" class="clinic-results"></section>
                </section>

                <section style="display: flex; flex-direction: column; width: 50%;">
                    <section class="reason-card" >
                        <p class="section-label">Reason for Visit</p>

                        <select class="reason-select">
                            <option>Select reason</option>
                            <option>General Checkup</option>
                            <option>Vaccination</option>
                            <option>Follow-up</option>
                            <option>Prescription Refill</option>
                            <option>Family Planning</option>
                            <option>Child Health</option>
                            <option>Chronic Medication</option>
                            <option>Other</option>
                        </select>
                    </section>

                    <!-- Appointment Date & Time Selector -->
                    <section class="appointment-datetime" >
                        <p class="section-label">Select Date & Time</p>
                        <section class="datetime-picker">
                            <input type="date" id="appt-date" />
                        
                        </section>
                    </section>
                </section>

            </section>
            
                <!-- Time Slot Selection -->
                <section class="time-slot-card">
                    <p class="section-label">Choose Time Slot</p>
                    <p class="slot-subtext">Available slots for your selected date</p>

                    <section id="timeSlots" class="time-slots"></section>

                    <!-- Hidden input for storing selected time -->
                    <input type="hidden" id="selectedTime">
                </section>

                <section class="hide">
                    
                </section>
                <button class="confirm-Button">Confirm Appointment</button>
            </section>
        </main>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="bookAppointment.js"></script>
    <script type="module" src="PatientDashboard.js"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="sidebarNotifications.js"></script>
</body>
</html>

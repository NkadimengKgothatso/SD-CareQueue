<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Care Queue</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="a-sidebar.css">
    <link rel="stylesheet" href="patientDashboard.css">
    
    <link rel="stylesheet" href="patientNotifications.css">

    
</head>
<body>

<header class="top-bar">
    <nav class="logo">
        <span class="logo-icon"></span>
        <span class="logo-name">Care Queue</span>
    </nav>

    <button class="sign-out-btn" onclick="signOut()">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
    </button>
</header>

<main class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav class="sidebar-nav">

            <section class="nav-item active" onclick="window.location.href='PatientDashboard.html'">
                <section class="nav-dot"></section>
                <span>Dashboard</span>
            </section>

            <section class="nav-item" onclick="window.location.href='BookAppointments.html'">
                <section class="nav-dot"></section>
                <span>Book Appointment</span>
            </section>

            <section class="nav-item" onclick="window.location.href='MyAppointments.html'">
                <section class="nav-dot"></section>
                <span>My Appointments</span>
            </section>

            <section class="nav-item" onclick="window.location.href='patientNotifications.html'">
                <section class="nav-dot"></section>
                <span>Notifications</span>
                <span id="sidebarUnreadCount" class="sidebar-badge">0</span>
            </section>

        </nav>

        <!-- USER PANEL -->
        <section class="sidebar-footer">
            <section class="user-info">
                <section class="user-avatar" id="patientAvatar">PT</section>
                <section class="user-details">
                    <section class="user-name" id="userName">Patient Name</section>
                    <!-- userRole: referenced by JS, hidden visually but must exist in DOM -->
                    <section class="user-email" id="userEmail">patient@email.com</section>
                    <span id="userRole" style="display:none;"></span>
                </section>
            </section>
        </section>
    </aside>



        <main class="main-content">

          <div class="page-head">
            <div>
              <h2>Notifications</h2>
              <p>Stay updated on appointments, queue status, and clinic alerts.</p>
            </div>
            <div class="actions">
              <button id="markAllBtn">Mark all as read</button>
              <button class="primary" id="clearBtn">Clear all</button>
            </div>
          </div>

          <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All <span class="count" id="count-all">0</span></button>
            <button class="filter-btn" data-filter="unread">Unread <span class="count" id="count-unread">0</span></button>
            <button class="filter-btn" data-filter="appointment">Appointments</button>
            <button class="filter-btn" data-filter="queue">Queue</button>
            <button class="filter-btn" data-filter="reminder">Reminders</button>
            <button class="filter-btn" data-filter="alert">Alerts</button>
          </div>

          <div class="notif-list" id="notifList"></div>
       
        </main>

    </section>
    <script type="module" src="PatientDashboard.js"></script>
    <script type="module" src="patientNotifications.js"></script>
    <script type="module" src="sidebarNotifications.js"></script>
    <script type="module" src="firebase.js"></script>
    
</body>
</html>

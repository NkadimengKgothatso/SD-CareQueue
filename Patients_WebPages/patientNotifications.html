<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Care Queue</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="bookAppointments.css">
    <link rel="stylesheet" href="patientNotifications.css">   
    <link rel="stylesheet" href="sidebar.css">
    
</head>
<body>

<header class="top-bar">
    <nav class="logo">
        <span class="logo-icon"></span>
        <span class="logo-name">Care Queue</span>
    </nav>

    <button class="sign-out-btn" onclick="signOut()">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
    </button>
</header>

<main class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="PatientDashboard.html"><i class="fa-solid fa-chart-bar"></i> Dashboard</a></li>

                <li><a href="BookAppointments.html"><i class="fa-solid fa-calendar-plus"></i> Book Appointment</a></li>

                <li><a href="MyAppointments.html"><i class="fa-solid fa-calendar-check"></i> My Appointments</a></li>

               
                <li><a href="patientNotifications.html"><i class="fa-solid fa-bell"></i> Notifications</a></li>
            </ul>
        </nav>

        <section class="user-section">
            <i class="fa-solid fa-user"></i>
            <address>
                <p class="name-surname" id="userName"></p>
                <p class="user-identity" id="userRole"></p>
            </address>
        </section>
    </aside>
        <main class="main-content">

          <div class="page-head">
            <div>
              <h2>Notifications</h2>
              <p>Stay updated on appointments, queue status, and clinic alerts.</p>
            </div>
            <div class="actions">
              <button id="markAllBtn">Mark all as read</button>
              <button class="primary" id="clearBtn">Clear all</button>
            </div>
          </div>

          <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All <span class="count" id="count-all">0</span></button>
            <button class="filter-btn" data-filter="unread">Unread <span class="count" id="count-unread">0</span></button>
            <button class="filter-btn" data-filter="appointment">Appointments</button>
            <button class="filter-btn" data-filter="queue">Queue</button>
            <button class="filter-btn" data-filter="reminder">Reminders</button>
            <button class="filter-btn" data-filter="alert">Alerts</button>
          </div>

          <div class="notif-list" id="notifList"></div>
       
        </main>

    </section>

    <script type="module" src="patientNotifications.js"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="PatientDashboard.js"></script>
</body>
</html>

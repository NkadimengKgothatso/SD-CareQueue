<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Care Queue</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="a-sidebar.css">
    <link rel="stylesheet" href="patientDashboard.css">
    
    <link rel="stylesheet" href="patientNotifications.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script type="module" src="../pwa.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" >
        <link rel="stylesheet" href="Staff.css">
        <link rel="manifest" href="../manifest.json">
        <meta name="theme-color" content="#2563eb">
        <script type="module" src="../pwa.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <link rel="stylesheet" href="a-sidebar.css">
        <link rel="stylesheet" href="patientDashboard.css">

    
</head>
<body>

<header class="top-bar">
    <nav class="logo">
        <section class="logo-icon"></section>
        <section class="logo-name">Care Queue</section>
    </nav>

    <button class="sign-out-btn" onclick="signOut()">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
    </button>
</header>

<!-- TOP BAR -->
<header class="top-bar">
    <section class="logo">
        <section class="logo-icon"></section>
        <section class="logo-name">Care Queue</section>
    </section>

    <button class="sign-out-btn" onclick="signOut()">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
    </button>
</header>

<!-- MAIN LAYOUT -->
<section class="admin-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav class="sidebar-nav">

            <section class="nav-item" onclick="window.location.href='PatientDashboard.html'">
                <section class="nav-dot"></section>
                <section>Dashboard</section>
            </section>

            <section class="nav-item" onclick="window.location.href='BookAppointments.html'">
                <section class="nav-dot"></section>
                <section>Book Appointment</section>
            </section>

            <section class="nav-item" onclick="window.location.href='MyAppointments.html'">
                <section class="nav-dot"></section>
                <section>My Appointments</section>
            </section>

            <section class="nav-item active" onclick="window.location.href='patientNotifications.html'">
                <section class="nav-dot"></section>
                <section>Notifications</section>
                <section id="sidebarUnreadCount" class="sidebar-badge">0</section>
            </section>

        </nav>

        <!-- USER PANEL -->
        <section class="sidebar-footer">
            <section class="user-info">
                <section class="user-avatar" id="patientAvatar">PT</section>
                <section class="user-details">
                    <section class="user-name" id="userName">Patient Name</section>
                    <!-- userRole: referenced by JS, hidden visually but must exist in DOM -->
                    <section class="user-email" id="userEmail">patient@email.com</section>
                    <section id="userRole" style="display:none;"></section>
                </section>
            </section>
        </section>
    </aside>

        <main class="main-content">

          <section class="page-head">
            <section>
              <h2>Notifications</h2>
              <p>Stay updated on appointments, queue status, and clinic alerts.</p>
            </section>
            <section class="actions">
              <button id="markAllBtn">Mark all as read</button>
              <button class="primary" id="clearBtn">Clear all</button>
            </section>
          </section>

          <section class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All <section class="count" id="count-all">0</section></button>
            <button class="filter-btn" data-filter="unread">Unread <section class="count" id="count-unread">0</section></button>
            
          </section>

          <section class="notif-list" id="notifList"></section>
       
        </main>

    </section>
    <script type="module" src="PatientDashboard.js"></script>
    <script type="module" src="patientNotifications.js"></script>
    <script type="module" src="sidebarNotifications.js"></script>
    <script type="module" src="firebase.js"></script>
    
</body>
</html>

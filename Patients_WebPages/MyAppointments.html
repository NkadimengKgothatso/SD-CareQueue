<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="a-sidebar.css">
    <link rel="stylesheet" href="patientDashboard.css">
    <link rel="stylesheet" href="myappointments.css">
    
    
    
</head>
<body>

    <header class="top-bar">
        <nav class="logo">
            <span class="logo-icon"></span>
            <span class="logo-name">Care Queue</span>
        </nav>
    </header>

    <main class="container">

       <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav class="sidebar-nav">

            <section class="nav-item" onclick="window.location.href='PatientDashboard.html'">
                <section class="nav-dot"></section>
                <span>Dashboard</span>
            </section>

            <section class="nav-item" onclick="window.location.href='BookAppointments.html'">
                <section class="nav-dot"></section>
                <span>Book Appointment</span>
            </section>

            <section class="nav-item active" onclick="window.location.href='MyAppointments.html'">
                <section class="nav-dot"></section>
                <span>My Appointments</span>
            </section>

            <section class="nav-item" onclick="window.location.href='patientNotifications.html'">
                <section class="nav-dot"></section>
                <span>Notifications</span>
                <span id="sidebarUnreadCount" class="sidebar-badge">0</span>
            </section>

        </nav>

        <!-- USER PANEL -->
        <section class="sidebar-footer">
            <section class="user-info">
                <section class="user-avatar" id="patientAvatar">PT</section>
                <section class="user-details">
                    <section class="user-name" id="userName">Patient Name</section>
                    <!-- userRole: referenced by JS, hidden visually but must exist in DOM -->
                    <section class="user-email" id="userEmail">patient@email.com</section>
                    <span id="userRole" style="display:none;"></span>
                </section>
            </section>
        </section>
    </aside>

        <section class="main-content">
            <h1>My Appointments</h1>

            <!-- Upcoming Appointments -->
            <section class="appt-section">
                <header class="section-header">
                    <h2 class="section-label">Upcoming Appointments</h2>
                   
                </header>

                <article class="carousel-outer">
                    <ul class="carousel-track" id="upcoming">


                    </ul>
                </article>
            </section>

            <!-- Past Appointments -->
           
                <section class="appt-section">
                    <header class="section-header">
                        <h2 class="section-label">Past Appointments</h2>
                    </header>

                    <article class="past-outer">
                        <ul id="past"></ul>
                    </article>
                </section>

        </section>

    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
   
  
    <script type="module" src="MyAppointments.js"></script>

    
    <script type="module" src="sidebarNotifications.js"></script>
   
</body>
</html>

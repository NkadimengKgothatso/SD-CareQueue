<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">        
    <title>Queue Management</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="../Patients_WebPages/bookAppointments.css">
    <link rel="stylesheet" href="walkin.css">  
    <link rel="stylesheet" href="Staff.css">
</head>

<body>

<!-- Top navigation bar -->
<header class="top-bar">
    <nav class="logo">
        <section class="logo-icon"></section>
        <section class="logo-name" style="vertical-align: middle;">Care Queue</section>
    </nav>
</header>

<section class="container">

<!-- Sidebar -->
<aside class="sidebar">

    <nav class="sidebar-nav">

        <section class="nav-item" onclick="window.location.href='StaffDashboard.html'">
            <section class="nav-dot"></section>
            <section>Dashboard</section>
        </section>

        <section class="nav-item" onclick="window.location.href='Availability.html'">
            <section class="nav-dot"></section>
            <section>My Availability</section>
        </section>

        <section class="nav-item" onclick="window.location.href='Appointments.html'">
            <section class="nav-dot"></section>
            <section>Manage Appointment</section>
        </section>

        <section class="nav-item" onclick="window.location.href='Queues.html'">
            <section class="nav-dot"></section>
            <section>Queue Management</section>
        </section>

        <section class="nav-item active" onclick="window.location.href='WalkIns.html'">
            <section class="nav-dot"></section>
            <section>Walk-in</section>
        </section>

    </nav>    

    <section class="sidebar-footer">
        <section class="user-info">

            <section class="user-avatar" id="staffAvatar"></section>

            <section class="user-details">
                <section class="user-name" id="staffName"></section>
                <section class="user-email" id="staffEmail"></section>
            </section>

        </section>
    </section>
</aside>

<main class="walkin-main">

    <h2 class="page-title">
        Walk-in Management
    </h2>

    <br>

    <p class="subtitle">Register and manage walk-in patients</p>

    <!-- QUEUE SECTION -->
    <section class="queue-section">

        <h3 class="queue-title">TODAY'S WALK-IN PATIENTS</h3>

        <table class="queue-table">

            <thead>
                <tr>
                    <th>#</th>
                    <th>Ticket Number</th>
                    <th>Patient</th>
                    <th>Reason</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="walkinTable"></tbody>

        </table>

    </section>

    <!-- REGISTER SECTION -->
    <section class="register-section">

        <h3 class="section-title">
            Add Walk-in Patient
        </h3>

        <form class="register-form">

            <label>Full name(s)</label>
            <input type="text" id="nameInput" placeholder="Patient full name">

            <label>Clinic visitation reason</label>
            <select id="reasonInput">
                <option>General Checkup</option>
                <option>Vaccination</option>
                <option>Follow up</option>
                <option>Prescription Refill</option>
                <option>Family Planning</option>
                <option>Child Health</option>
                <option>Chronic Medication</option>
                <option>Other</option>
            </select>

            <button type="button" class="add-btn">Add patient</button>

        </form>

    </section>

</main>

</section>

<script type="module" src="walkin.js"></script>
</body>
</html>

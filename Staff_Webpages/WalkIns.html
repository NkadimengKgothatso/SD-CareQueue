    <section class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

            <nav class="sidebar-nav">

                <section class="nav-item"
                    onclick="window.location.href='StaffDashboard.html'">
                    <section class="nav-dot"></section>
                    <span>Dashboard</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='Availability.html'">
                    <section class="nav-dot"></section>
                    <span>My Availability</span>

                <section class="nav-item"
                    onclick="window.location.href='Appointments.html'">
                    <section class="nav-dot"></section>

                    onclick="window.location.href='Analytics.html'">
                    <section class="nav-dot"></section>

                <section class="nav-item active"
                    onclick="window.location.href='WalkIns.html'">

                    <section class="nav-dot"></section>

                <section class="nav-item">
                    <section class="nav-dot"></section>
                    <span>Notifications</span>
                </section>

            </nav>    
            <section class="sidebar-footer">
                <section class="user-info">
        
                    <section class="user-avatar" id="staffAvatar">
                        <!-- initials will be injected by JS -->
                    </section>

                    <section class="user-details">
                        <section class="user-name" id="staffName"></section>
                        <section class="user-email" id="staffEmail"></section>
                    </section>

                </section>
            </section>
        </aside>
    </aside>
       <main class="walkin-main">

    <h2 class="page-title">
    <i class="fa-solid fa-hospital-user"></i>
    Walk-in Management
</h2><br></br>


    <p class="subtitle">Register and manage walk-in patients</p>

    <!-- QUEUE SECTION -->
    <section class="queue-section">

        <h3 class="queue-title">TODAY'S WALK-IN PATIENTS</h3>

        <table class="queue-table">

            <thead>
               <tr>
    <th>#</th>

    <th>
        <i class="fa-solid fa-ticket"></i>
        Ticket Number
    </th>

    <th>
        <i class="fa-solid fa-user"></i>
        Patient
    </th>

    <th>
        <i class="fa-solid fa-notes-medical"></i>
        Reason
    </th>

    <th>
        <i class="fa-regular fa-clock"></i>
        Time
    </th>

    <th>
        <i class="fa-solid fa-circle-info"></i>
        Status
    </th>
</tr>
            </thead>

            <tbody id="walkinTable" >

               

            </tbody>

            

        </table>

        

    </section>

    <!-- REGISTER SECTION -->
    <section class="register-section">

      <h3 class="section-title">
    <i class="fa-solid fa-user-plus"></i>
    Add Walk-in Patient
     </h3>

        <form class="register-form">

            <label>Full name(s)</label>
           <input type="text" id="nameInput" placeholder="Patient full name">

          <label>Clinic visitation reason</label>
            <select id="reasonInput">
                <option>General Checkup</option>
                <option>Vaccination</option>
                <option>Follow up</option>
                <option>Prescription Refill</option>
                <option>Family Planning</option>
                <option>Child Health</option>
                <option>Chronic Medication</option>
                <option>Other</option>
            </select>

            

            <button type="button" class="add-btn">Add patient</button>

        </form>

    </section>

</main>
            
    </section>

    <script type="module" src="walkin.js"></script>
    </body>

    
</html>

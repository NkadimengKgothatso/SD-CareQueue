<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">        
        <title>Queue Management</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" >
        <link rel="stylesheet" href="Staff.css">
        <script type="module" src="Queues.js"></script>
        
    </head>

    <body>
    <!-- Top navigation bar -->
    <header class="top-bar">
        <nav class="logo">
        <!-- Logo icon (green square with plus sign created with CSS) -->
        <span class="logo-icon"></span>
        <span class="logo-name" style="vertical-align: middle;">Care Queue</span>
        </nav>
    </header>

    <section class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

            <nav class="sidebar-nav">

                <section class="nav-item"
                    onclick="window.location.href='StaffDashboard.html'">
                    <section class="nav-dot"></section>
                    <span>Dashboard</span>
                </section>

                <section class="nav-item "
                    onclick="window.location.href='Availability.html'">
                    <section class="nav-dot"></section>
                    <span>My Availability</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='Appointments.html'">
                    <section class="nav-dot"></section>
                    <span>Manage Appointment</span>
                </section>

                <section class="nav-item active"
                    onclick="window.location.href='Queues.html'">
                    <section class="nav-dot"></section>
                    <span>Queue Management</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='Analytics.html'">
                    <section class="nav-dot"></section>
                    <span>Analytics</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='WalkIns.html'">

                    <section class="nav-dot"></section>
                    <span>Walk-in</span>
                </section>

                <section class="nav-item">
                    <section class="nav-dot"></section>
                    <span>Notifications</span>
                </section>

            </nav>
            <section class="sidebar-footer">
                <section class="user-info">
        
                    <section class="user-avatar" id="staffAvatar">
                        <!-- initials will be injected by JS -->
                    </section>

                    <section class="user-details">
                        <section class="user-name" id="staffName"></section>
                        <section class="user-email" id="staffEmail"></section>
                    </section>

                </section>
            </section>
        </aside>
    </aside>
        <main >
            <h1>Manage Queue </h1>
            <!-- ── Day Stats ─────────────────────────────────────── -->
            <section class="day-stats">
                <div class="stat-card">
                    <span class="stat-value" id="stat-total">—</span>
                    <span class="stat-label">Total today</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-inqueue">—</span>
                    <span class="stat-label">In queue now</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-avgwait">—</span>
                    <span class="stat-label">Avg wait</span>
                    <span class="stat-sub" id="stat-avgwait-trend"></span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-completed">—</span>
                    <span class="stat-label">Completed</span>
                </div>
            </section>
            <h2>Appointments</h2>
            <!-- Upcoming Appointments -->
            <section class="appt-section">
                <ul id="upcoming"></ul>
            </section>

        </main>
    </section>
    </body>
</html>

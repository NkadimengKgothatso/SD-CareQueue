                    <section class="user-details">

                        <section class="user-email" id="staffEmail"></section>

        <!-- Main Content -->

            <!-- Page Header -->
            <section class="page-header">

                <h2>My Availability</h2>

                <p>

                    to see patients.

            <!-- Week Schedule Card -->
            <div class="week-card">

                <div class="week-card-header">
                    <h3>Weekly Schedule</h3>
                </div>

                <!-- Monday -->
                <div class="day-row" id="row-monday">

                    <div class="day-label-group">

                            Monday

                        <label class="toggle-switch">

                            <input type="checkbox"
                                id="toggle-monday"
                                checked>

                            <span class="toggle-slider"></span>

                        </label>

                    </div>

                    <div class="time-range">

                        <label>From</label>

                        <input type="time"
                            class="time-input"
                            id="start-monday"
                            value="08:00">

                        <span class="time-separator">–</span>

                        <label>To</label>

                        <input type="time"
                            class="time-input"
                            id="end-monday"
                            value="17:00">

                    </div>

                </div>

                <!-- Tuesday -->
                <div class="day-row" id="row-tuesday">

                    <div class="day-label-group">

                        <span class="day-name">
                            Tuesday
                        </span>

                        <label class="toggle-switch">

                            <input type="checkbox"
                                id="toggle-tuesday"
                                checked>

                    </div>

                    <div class="time-range">

                        <input type="time"

                        </span>

                        <label class="toggle-switch">

                            <input type="checkbox"
                                id="toggle-wednesday"
                                checked>

                            <span class="toggle-slider"></span>

                        </label>

                    </div>

                    <div class="time-range">

                        <label>From</label>

                        <input type="time"
                            class="time-input"
                            id="start-wednesday"
                            value="08:00">

                        <span class="time-separator">–</span>

                        <label>To</label>

                        <input type="time"
                            class="time-input"
                            id="end-wednesday"
                            value="17:00">

                </div>

                <!-- Thursday -->
                <div class="day-row" id="row-thursday">

                    <div class="day-label-group">

                        <span class="day-name">
                            Thursday
                        </span>

                        <label class="toggle-switch">

                            <input type="checkbox"
                                id="toggle-thursday"
                                checked>

                            <span class="toggle-slider"></span>

                        </label>

                    </div>

                    <div class="time-range">

                        <label>From</label>

                        <input type="time"
                            class="time-input"
                            id="start-thursday"

                        <span class="time-separator">–</span>

                        <label>To</label>

                </div>

                <!-- Friday -->
                <div class="day-row" id="row-friday">

                    <div class="day-label-group">

                        <span class="day-name">
                            Friday
                        </span>

                        <label class="toggle-switch">

                            <input type="checkbox"
                                id="toggle-friday"
                                checked>

                    </div>

                    <div class="time-range">

                        <label>From</label>

                        <input type="time"

                            id="start-friday"

                        <span class="time-separator">–</span>

                        <input type="time"
                            class="time-input"
                            id="end-friday"
                            value="17:00">

                    </div>

                </div>

                <!-- Saturday -->
                <div class="day-row day-off"
                    id="row-saturday">

                    <div class="day-label-group">

                        <span class="day-name">
                            Saturday
                        </span>

                        <label class="toggle-switch">

                            <input type="checkbox"
                                id="toggle-saturday">

                            <span class="toggle-slider"></span>

                        </label>

                    </div>

                    <div class="time-range">

            <!-- Save Button -->
            <div class="save-section">

                <button class="save-btn"
                    id="saveBtn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Availability
                </button>

                <span class="save-status"
                    id="saveStatus"></span>

            </div>

        </main>

    </section>

    <!-- Toggle logic -->
    <script>

        const days = [
            "monday",
            "tuesday",
            "wednesday",
            "thursday",
            "friday",
            "saturday",
            "sunday"
        ];

        days.forEach(day => {

            const toggle =
                document.getElementById(`toggle-${day}`);

            const startInput =
                document.getElementById(`start-${day}`);

            const endInput =
                document.getElementById(`end-${day}`);

            const row =
                document.getElementById(`row-${day}`);

            function applyState() {

                const isOn = toggle.checked;

                startInput.disabled = !isOn;
                endInput.disabled = !isOn;

                row.classList.toggle(
                    "day-off",
                    !isOn
                );
            }

            applyState();

            toggle.addEventListener(
                "change",
                applyState
            );
        });

    </script>

    <script type="module"
        src="Availability.js"></script>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">        
        <title>Manage Appointments</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="Staff.css">
        <link rel="stylesheet" href="Appointments.css">
        <script type="module" src="Appointments.js"></script>
    </head>

    <body>
    <!-- Top navigation bar -->
    <header class="top-bar">
        <nav class="logo">
            <span class="logo-icon"></span>
            <span class="logo-name" style="vertical-align: middle;">Care Queue</span>
        </nav>
    </header>

    <section class="container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <nav class="sidebar-nav">

                <section class="nav-item"
                    onclick="window.location.href='StaffDashboard.html'">
                    <section class="nav-dot"></section>
                    <span>Dashboard</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='Availability.html'">
                    <section class="nav-dot"></section>
                    <span>My Availability</span>
                </section>

                <section class="nav-item active"
                    onclick="window.location.href='Appointments.html'">
                    <section class="nav-dot"></section>
                    <span>Manage Appointment</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='Queues.html'">
                    <section class="nav-dot"></section>
                    <span>Queue Management</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='Analytics.html'">
                    <section class="nav-dot"></section>
                    <span>Analytics</span>
                </section>

                <section class="nav-item"
                    onclick="window.location.href='WalkIns.html'">
                    <section class="nav-dot"></section>
                    <span>Walk-in</span>
                </section>

                <section class="nav-item">
                    <section class="nav-dot"></section>
                    <span>Notifications</span>
                </section>

            </nav>

            <section class="sidebar-footer">
                <section class="user-info">
                    <section class="user-avatar" id="staffAvatar">
                        <!-- initials injected by JS -->
                    </section>
                    <section class="user-details">
                        <section class="user-name" id="staffName"></section>
                        <section class="user-email" id="staffEmail"></section>
                    </section>
                </section>
            </section>

        </aside>

        <main>
            <h1>Manage Appointments</h1>

            <!-- ── Stats ─────────────────────────────────────────── -->
            <section class="day-stats">
                <div class="stat-card">
                    <span class="stat-value" id="stat-total">—</span>
                    <span class="stat-label">Total upcoming</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-today">—</span>
                    <span class="stat-label">Today</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-tomorrow">—</span>
                    <span class="stat-label">Tomorrow</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-walkin">—</span>
                    <span class="stat-label">Walk-ins</span>
                </div>
            </section>

            <!-- ── Filter Bar ─────────────────────────────────────── -->
            <section class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="today">Today</button>
                <button class="filter-btn" data-filter="tomorrow">Tomorrow</button>
                <button class="filter-btn" data-filter="walkin">Walk-ins</button>
            </section>

            <h2>Upcoming Appointments</h2>

            <!-- Appointment List -->
            <section class="appt-section">
                <ul id="appointmentList"></ul>
            </section>

        </main>

    </section>
    </body>
</html>
